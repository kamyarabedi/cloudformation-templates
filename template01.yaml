AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS re/Start Challenge Lab - Create a VPC, Internet Gateway,
  Security Group, Private Subnet, and EC2 instance using CloudFormation.

Parameters:

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI


Resources:

  # ------------------------------------------------------------
  # VPC
  # ------------------------------------------------------------

  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: LabVPC


  # ------------------------------------------------------------
  # Internet Gateway
  # ------------------------------------------------------------

  LabInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: LabInternetGateway


  # ------------------------------------------------------------
  # Attach Internet Gateway to VPC
  # ------------------------------------------------------------

  LabGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LabVPC
      InternetGatewayId: !Ref LabInternetGateway


  # ------------------------------------------------------------
  # Private Subnet
  # ------------------------------------------------------------

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: LabPrivateSubnet


  # ------------------------------------------------------------
  # Security Group 2
  # Allow SSH from anywhere
  # ------------------------------------------------------------

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access from anywhere
      VpcId: !Ref LabVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: LabSecurityGroup


  # ------------------------------------------------------------
  # EC2 Instance2
  # ------------------------------------------------------------

  LabEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref PrivateSubnet

      SecurityGroupIds:
        - !GetAtt InstanceSecurityGroup.GroupId

      Tags:
        - Key: Name
          Value: LabEC2Instance


Outputs:

  VpcId:
    Description: ID of the created VPC
    Value: !Ref LabVPC

  PrivateSubnetId:
    Description: ID of the private subnet
    Value: !Ref PrivateSubnet

  SecurityGroupId:
    Description: ID of the EC2 security group
    Value: !GetAtt InstanceSecurityGroup.GroupId

  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref LabEC2Instance

  InternetGatewayId:
    Description: ID of the Internet Gateway
    Value: !Ref LabInternetGateway